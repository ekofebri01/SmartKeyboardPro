name: Build and Release APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Signed Release APK
      env:
        STORE_PASSWORD: "android"
        KEY_PASSWORD: "android"
      run: |
        if [ ! -f "my-upload-key.jks" ]; then
          keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Smart Keyboard Pro, OU=Development, O=OpenSource, L=Jakarta, ST=Jakarta, C=ID"
        fi
        chmod +x gradlew || true
        ./gradlew assembleRelease || gradle assembleRelease

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: SmartKeyboardPro-release-signed
        path: app/build/outputs/apk/release/*.apk
